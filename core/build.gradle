plugins {
    id 'java-library'
    id 'jacoco'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true }
}
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'BUNDLE'
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 1.00 }
            limit { counter = 'INSTRUCTION'; value = 'COVEREDRATIO'; minimum = 1.00 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 1.00 }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification

sourceSets {
    benchmark {
        java.srcDir 'src/benchmark/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('transportBenchmark', JavaExec) {
    group = 'verification'
    description = 'Non-Forge logical transport benchmark: 1k/10k/100k cargo.'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'dev.nstut.virtuallogistics.core.TransportBenchmark'
    maxHeapSize = '2g'
}
