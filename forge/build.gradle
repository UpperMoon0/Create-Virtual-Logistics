plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
// Core classes must be part of the mod's module classloader during Forge dev runs.
sourceSets.main.java.srcDir rootProject.file('core/src/main/java')
archivesBaseName = 'create-virtual-logistics-forge-1.20.1'
minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            mods { createvirtuallogistics { source sourceSets.main } }
        }
        client {}
        server { arg '--nogui' }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', 'createvirtuallogistics'
        }
    }
}
repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.tterrag.com/' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.parchmentmc.org' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:' + minecraft_version + '-' + forge_version
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.0-rc.3'))
    implementation fg.deobf('io.github.llamalad7:mixinextras-forge:0.5.0-rc.3')
    implementation(fg.deobf('com.simibubi.create:create-' + minecraft_version + ':' + create_version + ':slim')) { transitive = false }
    implementation fg.deobf('net.createmod.ponder:Ponder-Forge-' + minecraft_version + ':' + ponder_version)
    compileOnly fg.deobf('dev.engine-room.flywheel:flywheel-forge-api-' + minecraft_version + ':' + flywheel_version)
    runtimeOnly fg.deobf('dev.engine-room.flywheel:flywheel-forge-' + minecraft_version + ':' + flywheel_version)
    implementation fg.deobf('com.tterrag.registrate:Registrate:' + registrate_version)
}
mixin {
    add sourceSets.main, 'createvirtuallogistics-refmap.json'
    config 'createvirtuallogistics.mixins.json'
}
tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes([
        'MixinConfigs': 'createvirtuallogistics.mixins.json',
        'Specification-Title': 'createvirtuallogistics',
        'Specification-Version': '1',
        'Implementation-Version': project.version
    ])
    finalizedBy 'reobfJar'
}

def prepareGameTestStructure = tasks.register('prepareGameTestStructure', Copy) {
    from layout.projectDirectory.dir('src/gametest/resources')
    into layout.projectDirectory.dir('run-gametest/gameteststructures')
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestStructure
}

def prepareGameTestConfig = tasks.register('prepareGameTestConfig', Copy) {
    from layout.projectDirectory.dir('src/gametest/config')
    into layout.projectDirectory.dir('run-gametest/config')
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareGameTestConfig
}
